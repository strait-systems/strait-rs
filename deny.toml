# Review exceptions with an owner, rationale, and revisit date; no blanket ignores.
[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "OpenSSL"]
confidence-threshold = 0.8
# Mozilla root-store data shipped by webpki-roots; restricted to this crate.
# Owner: project maintainers. Revisit with every webpki-roots version/license change.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

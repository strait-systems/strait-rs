name: Strait AI contract review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git revision to compare against the selected workflow commit
        required: true
        default: HEAD^
        type: string

permissions:
  contents: read

concurrency:
  group: strait-ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: AI review eligibility diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Explain review eligibility
        id: eligibility
        env:
          REVIEW_ENABLED: ${{ vars.STRAIT_AI_REVIEW_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ENABLED: ${{ vars.STRAIT_AI_REVIEW_ENABLED == 'true' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          READY: ${{ !github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          keys = (
              'REVIEW_ENABLED', 'EVENT_NAME', 'REPOSITORY', 'HEAD_REPOSITORY',
              'PR_DRAFT', 'AUTHOR_ASSOCIATION', 'ENABLED', 'MANUAL',
              'SAME_REPOSITORY', 'READY', 'PR_AUTHOR',
          )
          values = {key: os.environ[key] for key in keys}
          values['AUTHOR_PERMISSION'] = 'not_checked'
          values['TRUSTED_AUTHOR'] = 'false'
          if all(values[key] == 'true' for key in ('ENABLED', 'SAME_REPOSITORY', 'READY')) and values['MANUAL'] != 'true':
              result = subprocess.run(
                  ['gh', 'api', f"repos/{values['REPOSITORY']}/collaborators/{values['PR_AUTHOR']}/permission"],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              permission = json.loads(result.stdout)['permission']
              if permission not in ('admin', 'maintain', 'write', 'triage', 'read', 'none'):
                  raise ValueError('Unexpected repository permission; refusing review')
              values['AUTHOR_PERMISSION'] = permission
              values['TRUSTED_AUTHOR'] = str(permission in ('admin', 'maintain', 'write')).lower()
          eligible = values['ENABLED'] == 'true' and (
              values['MANUAL'] == 'true' or all(
                  values[key] == 'true'
                  for key in ('SAME_REPOSITORY', 'READY', 'TRUSTED_AUTHOR')
              )
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('eligible=' + str(eligible).lower() + '\n')
          values['EXPECTED_REVIEW_JOB'] = 'run' if eligible else 'skip'
          # Escape metadata so it cannot inject log commands or summary markup.
          report = json.dumps(values, indent=2, ensure_ascii=True)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## AI review eligibility\n\n```json\n' + report + '\n```\n')
          PY

  review:
    name: Contract, performance, and security review
    needs: diagnostics
    if: needs.diagnostics.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report_artifact: ${{ steps.report.outputs.artifact-id }}
    env:
      REVIEW_BASE: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check review configuration and scope
        env:
          REVIEW_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$REVIEW_API_KEY" ]; then
            echo '::error::STRAIT_AI_REVIEW_ENABLED requires the OPENAI_API_KEY repository secret.'
            exit 1
          fi
          git rev-parse --verify --end-of-options "${REVIEW_BASE}^{commit}"
          git fetch --no-tags origin "$REVIEW_HEAD"
          git rev-parse --verify --end-of-options "${REVIEW_HEAD}^{commit}"
          test -f skills/strait-contract-review/SKILL.md
          test -f skills/strait-performance-check/SKILL.md
          test -f skills/strait-security-review/SKILL.md
          test -f .github/scripts/check-review-decision.py

      - name: Apply repository review skills
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          safety-strategy: drop-sudo
          prompt-file: .github/codex/prompts/skill-review.md
          output-file: ${{ runner.temp }}/strait-skill-review.md

      - name: Retain review report
        id: report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strait-skill-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strait-skill-review.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce review disposition
        run: python3 .github/scripts/check-review-decision.py "$RUNNER_TEMP/strait-skill-review.md"

      - name: Explain review result
        if: always()
        run: |
          echo '## Strait AI review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the strait-skill-review artifact for findings and evidence gaps.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The disposition gate is an AI recommendation, not a safety or latency certification.' >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Publish AI review to PR
    needs: review
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.review.outputs.report_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download this run's review report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name "strait-skill-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --dir "$RUNNER_TEMP/strait-review"

      - name: Create or update review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -B .github/scripts/publish-review-comment.py
          "$RUNNER_TEMP/strait-review/strait-skill-review.md"
